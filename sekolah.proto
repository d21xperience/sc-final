// =========================================
// =============Tabel Referensi=============
// =========================================
service ReferensiService {
  rpc GetBentukPendidikan (Empty) returns (GetBentukPendidikanResponse){
    option (google.api.http) = {
      get: "/api/v1/ss/ref/bentuk-pendidikan"
    };
  }
  rpc GetJenjang (Empty) returns (GetJenjangResponse){
    option (google.api.http) = {
      get: "/api/v1/ss/ref/jenjang"
    };
  }
  rpc GetTingkatPendidikan (GetTingkatPendidikanRequest) returns (GetTingkatPendidikanResponse){
    option (google.api.http) = {
      get: "/api/v1/ss/ref/tingkat-pendidikan"
    };
  }
  rpc GetStatusKepemilikan (Empty) returns (GetStatusKepemilikanResponse){
    option (google.api.http) = {
      get: "/api/v1/ss/ref/status-kepemilikan"
    };
  }
  rpc GetJurusan (GetJurusanRequest) returns (GetJurusanResponse){
    option (google.api.http) = {
      get: "/api/v1/ss/ref/jurusan"
    };
  }
  rpc GetKurikulum (GetKurikulumRequest) returns (GetKurikulumResponse){
    option (google.api.http) = {
      get: "/api/v1/ss/ref/kurikulum"
    };
  }
  rpc GetMapel (GetMapelRequest) returns (GetMapelResponse) {
    option (google.api.http) = {
      get: "/api/v1/ss/ref/mapel"
    };
  }
}


message Empty {}
message BentukPendidikan {
  uint32 bentuk_pendidikan_id = 1;
  string nama = 2;
  uint32 jenjang_paud = 3;
  uint32 jenjang_tk = 4;
  uint32 jenjang_sd = 5;
  uint32 jenjang_smp = 6;
  uint32 jenjang_sma = 7;
  uint32 jenjang_tinggi = 8;
  string direktorat_pembinaan = 9;
  uint32 aktif = 10;
  string formalitas_pendidikan = 11;
}
message Jenjang {
  uint32 jenjang_pendidikan_id = 1;
  string nama = 2;
  uint32 jenjang_lembaga = 3;
  uint32 jenjang_orang = 4;
}
message TingkatPendidikan {
  int32 tingkat_pendidikan_id = 1;
  string kode = 2;
  string nama = 3;
  uint32 jenjang_pendidikan_id = 4;
}
message StatusKepemilikan {
  uint32 status_kepemilikan_id = 1;
  string nama = 2;
}

// Message untuk tabel Jurusan
message Jurusan {
  string jurusan_id = 1;
  string nama_jurusan = 2;
  uint32 untuk_sma = 3;
  uint32 untuk_smk = 4;
  uint32 untuk_pt = 5;
  uint32 untuk_slb = 6;
  uint32 untuk_smklb = 7;
  uint32 jenjang_pendidikan_id = 8;
  string jurusan_induk = 9;
  string level_bidang_id = 10;
  // string create_date = 11;
  // string last_update = 12;
  // string expired_date = 13;
  // string last_sync = 14;
}
// Message untuk tabel Kurikulum
message Kurikulum {
  uint32 kurikulum_id = 1;
  string nama_kurikulum = 2;
  string mulai_berlaku = 3;
  uint32 sistem_sks = 4;
  uint32 total_sks = 5;
  uint32 jenjang_pendidikan_id = 6;
  string jurusan_id = 7;
  // string create_date = 8;
