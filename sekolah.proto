// MATA PELAJARAN SERVICE
service PembelajaranService {    
  // CRUD for Pembelajaran
  rpc CreatePembelajaran (CreatePembelajaranRequest) returns (CreatePembelajaranResponse) {
    option (google.api.http) = {
      post: "/api/v1/ss/pembelajaran/create"
      body: "*"
    };
  }
  rpc CreateBanyakPembelajaran (CreateBanyakPembelajaranRequest) returns (CreateBanyakPembelajaranResponse) {
    option (google.api.http) = {
      post: "/api/v1/ss/pembelajaran/create-banyak"
      body: "*"
    };
  }
  rpc GetPembelajaran (GetPembelajaranRequest) returns (GetPembelajaranResponse) {
    option (google.api.http) = {
      get: "/api/v1/ss/pembelajaran"
    };
  }
  rpc UpdatePembelajaran (UpdatePembelajaranRequest) returns (UpdatePembelajaranResponse) {
    option (google.api.http) = {
      put: "/api/v1/ss/pembelajaran/update"
      body: "*"
    };
  }
  rpc DeletePembelajaran (DeletePembelajaranRequest) returns (DeletePembelajaranResponse) {
    option (google.api.http) = {
      delete: "/api/v1/ss/pembelajaran/delete"
    };
  }
}

message Pembelajaran {
  string	pembelajaran_id	= 1;
  string	rombongan_belajar_id	= 2;
  int32	  mata_pelajaran_id	= 3;
  string	semester_id	= 4;
  string	ptk_terdaftar_id	= 5;
  int32	  status_di_kurikulum	= 6;
  string	nama_mata_pelajaran	= 7;
  string	induk_pembelajaran	= 8;  
  int32	  is_dapo	= 9;  
  PTKTerdaftar ptk_terdaftar = 10;
  // Kelas rombongan_belajar= 11;
  // Mapel mata_pelajaran= 12;
}

message CreatePembelajaranRequest {
  repeated Pembelajaran pembelajaran = 1;
  string schemaname = 2;
}
message CreatePembelajaranResponse {
  string message = 1;
  bool status = 2;
}

message CreateBanyakPembelajaranRequest {
  string schemaname = 1;
  repeated Pembelajaran pembelajaran = 2;
}
message CreateBanyakPembelajaranResponse {
  string message = 1;
  bool status = 2;
}
message GetPembelajaranRequest {
  string schemaname = 1;
  string semester_id = 2;
  optional string pembelajaran_id = 3;
}
message GetPembelajaranResponse {
  repeated Pembelajaran pembelajaran = 1;
}
message UpdatePembelajaranRequest {
  string schemaname = 1;
  // string pembelajaran_id = 2;
  Pembelajaran pembelajaran = 2;
}
  message UpdatePembelajaranResponse {
  string message = 1;
  bool status = 2;
}
  message DeletePembelajaranRequest {
  string schemaname = 1;
  string pembelajaran_id = 2;
}
message DeletePembelajaranResponse {
  string message = 1;
  bool status = 2;
}

