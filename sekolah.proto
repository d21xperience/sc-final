// =========================================
// service kenaikan kelas
// =========================================
service KenaikanService {
  // CRUD IZAJAH
  rpc CreateKenaikan(CreateKenaikanRequest) returns (CreateKenaikanResponse) {
    option (google.api.http) = {
      post: "/api/v1/kenaikan/create"
      body: "*"
    };
  }
  rpc GetKenaikan(GetKenaikanRequest) returns (GetKenaikanResponse) {
    option (google.api.http) = {
      get: "/api/v1/kenaikan"
    };
  }
  rpc FilterKenaikan(FilterKenaikanRequest) returns (FilterKenaikanResponse) {
    option (google.api.http) = {
      get: "/api/v1/kenaikan/filter"
    };
  }
  rpc UpdateKenaikan(UpdateKenaikanRequest) returns (UpdateKenaikanResponse) {
    option (google.api.http) = {
      put: "/api/v1/kenaikan"
      body:"*"
    };
  }
  rpc DeleteKenaikan(DeleteKenaikanRequest) returns (DeleteKenaikanResponse) {
    option (google.api.http) = {
      delete: "/api/v1/kenaikan"
    };
  }
  // UPLOAD Kenaikan
  rpc UploadKenaikan (UploadKenaikanRequest) returns (UploadKenaikanResponse) {
    option (google.api.http) = {
      post: "/api/v1/it/kenaikan/upload"
      body: "*"
    };
  }
}

message Kenaikan {
  string semester_id = 1;
  string anggota_rombel_id = 2;
  string peserta_didik_id = 3;
}

message CreateKenaikanRequest {
  Kenaikan kenaikan = 1;
}
message CreateKenaikanResponse {
  string message = 1;
}
message GetKenaikanRequest {
  string semester_id = 1;
}
message GetKenaikanResponse {
  repeated AnggotaKelas anggotaKelas = 1;
  repeated Siswa siswa = 2;
}
message FilterKenaikanRequest {
  string semester_id = 1;
  int32 tingkat = 2;
  string rombongan_belajar_id = 3;
}
message FilterKenaikanResponse {
  repeated AnggotaKelas anggotaKelas = 1;
  repeated Siswa siswa = 2;
}
message UpdateKenaikanRequest {
  Kenaikan kenaikan = 1;
}
message UpdateKenaikanResponse {
  string message = 1;
}
message DeleteKenaikanRequest {
  Kenaikan kenaikan = 1;
}
message DeleteKenaikanResponse {
  string message = 1;
}
message UploadKenaikanRequest {
  repeated Kenaikan kenaikan = 1;
}
message UploadKenaikanResponse {
  string message = 1;
}


